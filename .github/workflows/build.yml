name: Build Data

on:
  workflow_call:
    inputs:
      package-version:
        description: NuGet package version to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore data-core.slnx

      - name: Test
        run: dotnet test data-core.slnx --configuration Release --no-restore

      - name: Pack Data.Core
        run: |
          dotnet pack \
            src/Amiasea.Enterprise.Data.Core/Amiasea.Enterprise.Data.Core.csproj \
            --configuration Release \
            --no-restore \
            --output artifacts \
            -p:PackageVersion="${{ inputs.package-version }}"

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 14
